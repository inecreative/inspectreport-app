<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">A shared estimate, as the client sees it</title>
  <desc id="svgDesc">A browser window showing the Bathroom leak repair estimate with line items, a $2,431.15 total, an optional add-on, an Approve estimate button, and an Approved confirmation.</desc>

  <!-- soft shadow -->
  <rect x="74" y="60" width="520" height="472" rx="16" fill="#0F2A3D" opacity="0.10"/>

  <!-- browser window -->
  <rect x="60" y="44" width="520" height="472" rx="16" fill="#FFFFFF" stroke="#E7E2D6" stroke-width="1.5"/>
  <line x1="60" y1="86" x2="580" y2="86" stroke="#EDE8DC" stroke-width="1.5"/>
  <circle cx="86" cy="65" r="5" fill="#E5E7EB"/>
  <circle cx="104" cy="65" r="5" fill="#E5E7EB"/>
  <circle cx="122" cy="65" r="5" fill="#E5E7EB"/>
  <rect x="140" y="52" width="270" height="26" rx="13" fill="#F3F4F6"/>
  <text x="154" y="69" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6B7280">inspect-report.com/s/…</text>

  <!-- document header -->
  <rect x="88" y="104" width="96" height="27" rx="7" fill="#D97706"/>
  <text x="136" y="122" text-anchor="middle" font-family="'Archivo', Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">ESTIMATE</text>
  <rect x="428" y="104" width="124" height="27" rx="13.5" fill="#FEF3C7"/>
  <circle cx="447" cy="117.5" r="4" fill="#D97706"/>
  <text x="459" y="122" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E">Viewed</text>

  <text x="88" y="166" font-family="'Archivo', Arial, sans-serif" font-size="25" font-weight="800" fill="#0F2A3D">Bathroom leak repair</text>
  <text x="88" y="190" font-family="'Inter', Arial, sans-serif" font-size="13.5" fill="#6B7280">Estimate EST-1042 · Valid for 30 days</text>
  <line x1="88" y1="206" x2="552" y2="206" stroke="#EDE8DC" stroke-width="1.5"/>

  <!-- line items -->
  <text x="88" y="238" font-family="'Inter', Arial, sans-serif" font-size="15" fill="#111827">Labor — repair leak &amp; re-pipe</text>
  <text x="552" y="238" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F2A3D">$1,150.00</text>
  <text x="88" y="270" font-family="'Inter', Arial, sans-serif" font-size="15" fill="#111827">Materials — trap, valves &amp; pipe</text>
  <text x="552" y="270" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F2A3D">$630.00</text>
  <text x="88" y="302" font-family="'Inter', Arial, sans-serif" font-size="15" fill="#111827">Cabinet base rebuild</text>
  <text x="552" y="302" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F2A3D">$600.00</text>
  <line x1="88" y1="318" x2="552" y2="318" stroke="#EDE8DC" stroke-width="1.5"/>

  <!-- totals -->
  <text x="88" y="344" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#6B7280">Subtotal</text>
  <text x="552" y="344" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#374151">$2,380.00</text>
  <text x="88" y="368" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#6B7280">Tax</text>
  <text x="552" y="368" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#374151">$51.15</text>
  <text x="88" y="398" font-family="'Archivo', Arial, sans-serif" font-size="18" font-weight="800" fill="#0F2A3D">Total</text>
  <text x="552" y="398" text-anchor="end" font-family="'Archivo', Arial, sans-serif" font-size="20" font-weight="800" fill="#0F2A3D">$2,431.15</text>

  <!-- optional add-on -->
  <rect x="88" y="412" width="464" height="40" rx="9" fill="#FFFBEB" stroke="#EDE8DC" stroke-width="1"/>
  <rect x="102" y="422" width="20" height="20" rx="5" fill="#D97706"/>
  <path d="M107 432 l3.5 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="134" y="437" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#374151">Optional add-on: leak sensor install</text>
  <text x="538" y="437" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">$485.00</text>

  <!-- approve row -->
  <rect x="88" y="464" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#D9D2C0" stroke-width="1.5"/>
  <text x="103" y="489" font-family="'Inter', Arial, sans-serif" font-size="14.5" fill="#374151">Jordan Miller</text>
  <rect x="302" y="464" width="250" height="40" rx="10" fill="#D97706"/>
  <text x="427" y="489" text-anchor="middle" font-family="'Archivo', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF">Approve estimate</text>

  <!-- approved sticker -->
  <rect x="372" y="494" width="252" height="52" rx="26" fill="#0F2A3D"/>
  <circle cx="400" cy="520" r="13" fill="#15803D"/>
  <path d="M394 520 l4.5 4.5 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="422" y="525" font-family="'Inter', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Approved · Jordan Miller</text>
</svg>
